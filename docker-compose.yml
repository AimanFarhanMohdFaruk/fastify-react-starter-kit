services:
  postgres:
    # Official Postgres 18 with pgvector preinstalled.
    # Stock postgres images do not ship the vector extension.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: starter_kit
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - kit_pg_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kit -d starter_kit']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # S3-compatible object store (API :9000, console :9001).
  # Point the app at http://localhost:9000 with forcePathStyle.
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # Local defaults — override before exposing beyond localhost.
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - kit_rustfs_data:/data

volumes:
  kit_pg_data:
  kit_rustfs_data:
