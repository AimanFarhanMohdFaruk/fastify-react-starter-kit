# Production stack — bring your own Postgres (cloud or otherwise).
# No database service here on purpose.
#
#   cp .env.production.example .env.production   # set DATABASE_URL + APP_URL
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# App: http://localhost:${HOST_PORT:-80}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
    expose:
      - "3000"
    networks:
      - kit

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
    networks:
      - kit
    depends_on:
      web:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - kit

networks:
  kit:
